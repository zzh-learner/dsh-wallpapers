<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  html,body{height:100%;margin:0}
  body{
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(#bfe7fb,#eefbf4);
    font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  }
  svg{width:min(96vw,150vh);height:auto;display:block;
      filter:drop-shadow(0 18px 30px rgba(30,60,90,.16))}
  /* 所有动画元素以 viewBox 坐标系为变换基准 */
  svg *{transform-box:view-box}

  /* ---- 关键帧 ---- */
  @keyframes thighPedal{0%{transform:rotate(0deg)}2.78%{transform:rotate(4.97deg)}5.56%{transform:rotate(10.13deg)}8.33%{transform:rotate(15.35deg)}11.11%{transform:rotate(20.46deg)}13.89%{transform:rotate(25.2deg)}16.67%{transform:rotate(29.17deg)}19.44%{transform:rotate(31.89deg)}22.22%{transform:rotate(33.18deg)}25%{transform:rotate(33.37deg)}27.78%{transform:rotate(32.85deg)}30.56%{transform:rotate(31.9deg)}33.33%{transform:rotate(30.65deg)}36.11%{transform:rotate(29.16deg)}38.89%{transform:rotate(27.46deg)}41.67%{transform:rotate(25.53deg)}44.44%{transform:rotate(23.37deg)}47.22%{transform:rotate(20.93deg)}50%{transform:rotate(18.19deg)}52.78%{transform:rotate(15.09deg)}55.56%{transform:rotate(11.6deg)}58.33%{transform:rotate(7.7deg)}61.11%{transform:rotate(3.41deg)}63.89%{transform:rotate(-1.16deg)}66.67%{transform:rotate(-5.82deg)}69.44%{transform:rotate(-10.27deg)}72.22%{transform:rotate(-14.18deg)}75%{transform:rotate(-17.22deg)}77.78%{transform:rotate(-19.18deg)}80.56%{transform:rotate(-19.96deg)}83.33%{transform:rotate(-19.6deg)}86.11%{transform:rotate(-18.18deg)}88.89%{transform:rotate(-15.84deg)}91.67%{transform:rotate(-12.72deg)}94.44%{transform:rotate(-8.96deg)}97.22%{transform:rotate(-4.68deg)}100%{transform:rotate(0deg)}}
@keyframes shinPedal{0%{transform:rotate(0deg)}2.78%{transform:rotate(-7.39deg)}5.56%{transform:rotate(-14.69deg)}8.33%{transform:rotate(-21.72deg)}11.11%{transform:rotate(-28.22deg)}13.89%{transform:rotate(-33.71deg)}16.67%{transform:rotate(-37.37deg)}19.44%{transform:rotate(-38.23deg)}22.22%{transform:rotate(-35.99deg)}25%{transform:rotate(-31.37deg)}27.78%{transform:rotate(-25.34deg)}30.56%{transform:rotate(-18.55deg)}33.33%{transform:rotate(-11.37deg)}36.11%{transform:rotate(-4.02deg)}38.89%{transform:rotate(3.38deg)}41.67%{transform:rotate(10.72deg)}44.44%{transform:rotate(17.91deg)}47.22%{transform:rotate(24.86deg)}50%{transform:rotate(31.48deg)}52.78%{transform:rotate(37.67deg)}55.56%{transform:rotate(43.28deg)}58.33%{transform:rotate(48.17deg)}61.11%{transform:rotate(52.17deg)}63.89%{transform:rotate(55.09deg)}66.67%{transform:rotate(56.79deg)}69.44%{transform:rotate(57.16deg)}72.22%{transform:rotate(56.17deg)}75%{transform:rotate(53.9deg)}77.78%{transform:rotate(50.46deg)}80.56%{transform:rotate(46.04deg)}83.33%{transform:rotate(40.8deg)}86.11%{transform:rotate(34.9deg)}88.89%{transform:rotate(28.5deg)}91.67%{transform:rotate(21.72deg)}94.44%{transform:rotate(14.64deg)}97.22%{transform:rotate(7.38deg)}100%{transform:rotate(0deg)}}
  @keyframes wheelSpin{to{transform:rotate(360deg)}}
  @keyframes crankSpin{to{transform:rotate(360deg)}}
  @keyframes pedalCtr{to{transform:rotate(-360deg)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes shadowPulse{0%,100%{transform:scaleX(1);opacity:.17}50%{transform:scaleX(.93);opacity:.24}}
  @keyframes raysTurn{to{transform:rotate(360deg)}}
  @keyframes cloudDrift{to{transform:translateX(-1750px)}}
  @keyframes hillScroll{to{transform:translateX(-1680px)}}
  @keyframes hillScroll2{to{transform:translateX(-1680px)}}
  @keyframes treeScroll{to{transform:translateX(-300px)}}
  @keyframes dashScroll{to{transform:translateX(-130px)}}
  @keyframes grassScroll{to{transform:translateX(-240px)}}
  @keyframes chainRun{to{stroke-dashoffset:-52}}
  @keyframes nod{0%,100%{transform:rotate(0deg)}25%{transform:rotate(1.6deg)}75%{transform:rotate(-1.2deg)}}
  @keyframes flap{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-3.5deg)}}
  @keyframes tailWag{0%,100%{transform:rotate(0deg)}50%{transform:rotate(3.5deg)}}
  @keyframes squawk{
    0%,76%{transform:rotate(0deg)}
    81%{transform:rotate(13deg)}
    85%{transform:rotate(9deg)}
    89%{transform:rotate(16deg)}
    94%,100%{transform:rotate(0deg)}
  }
  @keyframes bubbleShow{
    0%,73%{opacity:0;transform:translateY(10px)}
    79%,90%{opacity:1;transform:translateY(0)}
    97%,100%{opacity:0;transform:translateY(-6px)}
  }
  @keyframes whoosh{
    0%{opacity:0;transform:translateX(20px)}
    35%{opacity:.75}
    70%,100%{opacity:0;transform:translateX(-42px)}
  }

  /* ---- 应用 ---- */
  .riderBob{animation:bob .8s ease-in-out infinite}
  .shadow{transform-box:fill-box;transform-origin:center;animation:shadowPulse .8s ease-in-out infinite}
  .rays{animation:raysTurn 26s linear infinite}
  .cl1{animation:cloudDrift 22s linear infinite;animation-delay:-7s}
  .cl2{animation:cloudDrift 32s linear infinite;animation-delay:-19s}
  .cl3{animation:cloudDrift 15s linear infinite;animation-delay:-3s}
  .hillsFar{animation:hillScroll 24s linear infinite}
  .hillsNear{animation:hillScroll2 12s linear infinite}
  .trees{animation:treeScroll 1.9s linear infinite}
  .roadDash{animation:dashScroll .42s linear infinite}
  .grassFG{animation:grassScroll .75s linear infinite}
  .chainLink{stroke-dasharray:7 6;animation:chainRun .55s linear infinite}
  .wheelSpin{animation:wheelSpin 1.6s linear infinite}
  .crank{animation:crankSpin 1.6s linear infinite}
  .crankFar{animation:crankSpin 1.6s linear infinite;animation-delay:-.8s}
  .pedalC{animation:pedalCtr 1.6s linear infinite}
  .pedalCFar{animation:pedalCtr 1.6s linear infinite;animation-delay:-.8s}
  .thighR,.thighF{transform-origin:402px 288px;animation:thighPedal 1.6s linear infinite}
  .thighF{animation-delay:-.8s}
  .shinR,.shinF{transform-origin:487.14px 330.15px;animation:shinPedal 1.6s linear infinite}
  .shinF{animation-delay:-.8s}
  .headNod{transform-origin:506px 152px;animation:nod .8s ease-in-out infinite}
  .wingFlap{transform-origin:432px 212px;animation:flap .8s ease-in-out infinite}
  .tailWag{transform-origin:332px 214px;animation:tailWag 1.6s ease-in-out infinite}
  .pouchSq{transform-origin:524px 148px;animation:squawk 7s ease-in-out infinite}
  .bubble{transform-origin:700px 80px;animation:bubbleShow 7s ease-out infinite}

  .sl1{animation:whoosh 1.7s linear infinite}
  .sl2{animation:whoosh 1.7s linear infinite;animation-delay:.28s}
  .sl3{animation:whoosh 1.7s linear infinite;animation-delay:.56s}

  @media (prefers-reduced-motion:reduce){
    svg *{animation-play-state:paused!important}
  }
</style>
</head>
